# 外骨骼助力机器人 — 电源系统配置
# 版本 V1.0 | 维护 zhiqiang.yang

# 电源设备列表
power_sources:

  - name: "charger_ip2366"
    type: "charger"
    config:
      # I2C 通信
      i2c_dev: "/dev/i2c-2"
      addr: 0xEA

      # GPIO
      int_gpio_chip: "gpiochip0"
      int_gpio_line: 39       # GPIO0_C7
      charge_en_gpio_chip: "gpiochip2"
      charge_en_gpio_line: 4  # GPIO2_A4

      # INT 轮询间隔
      int_poll_interval_ms: 100

    params:
      # 充电参数
      pdo_select: 5             # 5=20V (手册: 1=5V,2=9V,3=12V,4=15V,5=20V)
      charge_voltage_mv: 4200   # 单节充满电压 mV (6S: 25.2V)
      charge_current_ma: 3000   # 充电电流 mA
      trickle_current_ma: 200   # 涓流电流 mA
      stop_current_ma: 100      # 停充电流 mA

  # BMS 电池包 (静态注册, 包装 BatteryDispatcher)
  - name: "battery_bms"
    type: "battery"

# 充电管理参数
charge_manager:
  # 消抖
  adapter_debounce_ms: 200
  fault_debounce_ms: 500
  recovery_debounce_ms: 2000

  # 充满判断
  full_soc_percent: 100
  full_current_ma: 200
  recharge_hysteresis_mv: 200

  # 超时
  cc_timeout_min: 240          # CC 阶段超时 (4小时)
  total_timeout_min: 480       # 总超时 (8小时)

  # PD 协商超时
  pd_timeout_ms: 10000

  # 交叉验证
  cross_verify_charge: true
  vbus_present_mv: 4000

# 安全保护
safety:
  max_temp_c: 85               # 充电最高温度
  resume_temp_c: 75            # 恢复充电温度
  max_current_ma: 30000        # 最大充电电流
  min_voltage_per_cell_mv: 2800  # 单节最低电压
